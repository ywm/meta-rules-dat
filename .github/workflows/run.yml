name: Build GeoLite2-ASN.mmdb

on:
  workflow_dispatch:
  schedule:
    # 上游 xishang0128/geoip 每周四 00:00 UTC 构建，这里延后一天到周五
    - cron: "0 0 * * 5" # Friday 00:00 UTC / 08:00 UTC+8
  push:
    branches:
      - master
    paths:
      - ".github/workflows/run.yml"
      - "resouces/asn-allowlist.txt"
      - "resouces/mmdb-trim/**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set variables
        run: echo "BUILDTIME=$(TZ=Asia/Shanghai date +'%Y-%m-%d %H:%M')" >> $GITHUB_ENV

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.25"
          cache-dependency-path: resouces/mmdb-trim/go.sum

      - name: Download GeoLite2-ASN.mmdb
        run: |
          curl -fsSL --retry 3 -o "$RUNNER_TEMP/GeoLite2-ASN.mmdb" \
            https://raw.githubusercontent.com/xishang0128/geoip/release/GeoLite2-ASN.mmdb
          ls -l "$RUNNER_TEMP/GeoLite2-ASN.mmdb"

      - name: Trim to allowlisted ASNs
        run: |
          mkdir -p publish
          cd resouces/mmdb-trim
          go run . \
            -src "$RUNNER_TEMP/GeoLite2-ASN.mmdb" \
            -dst "$RUNNER_TEMP/trimmed.mmdb" \
            -allowlist "$GITHUB_WORKSPACE/resouces/asn-allowlist.txt"

      - name: Shrink and verify
        run: |
          go install github.com/ipinfo/mmdbctl/mmdbshrink@v0.0.0-20261103094941-7b7d1eb8a624
          go install github.com/maxmind/mmdbverify@v1.1.0
          "$(go env GOPATH)/bin/mmdbshrink" "$RUNNER_TEMP/trimmed.mmdb" publish/GeoLite2-ASN.mmdb
          "$(go env GOPATH)/bin/mmdbverify" -file publish/GeoLite2-ASN.mmdb
          ls -l publish

      - name: Checksum
        run: |
          cd publish || exit 1
          sha256sum GeoLite2-ASN.mmdb > GeoLite2-ASN.mmdb.sha256sum
          cat GeoLite2-ASN.mmdb.sha256sum

      - name: Delete release if exist then create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release delete latest --cleanup-tag -y || true
          gh release create latest --title "Release ${{ env.BUILDTIME }}" ./publish/*

      - name: Git push assets to "release" branch
        run: |
          cd publish || exit 1
          git init
          git config --local user.name "github-actions[bot]"
          git config --local user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b release
          git add .
          git commit -m "Released on ${{ env.BUILDTIME }}"
          git remote add origin "https://${{ github.actor }}:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}"
          git push -f -u origin release

      - name: Purge jsdelivr CDN
        run: |
          cd publish || exit 1
          for file in $(ls); do
            curl -sS -o /dev/null -w "purge ${file}: %{http_code}\n" \
              "https://purge.jsdelivr.net/gh/${{ github.repository }}@release/${file}"
          done
